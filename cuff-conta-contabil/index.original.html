          return '<option value="' + h + '"' + (String(c.blingAutoHoras || "") === h ? " selected" : "") + ">" + label + "</option>";
        }).join("") +

        '<p class="hint-note" style="margin-top:4px;">' + (c.blingUltimoResultado ? escapeHtml(c.blingUltimoResultado) : "Ainda não tentou nenhuma busca automática.") + "</p>" +

    }).join("") || '<div class="hint-note" style="padding:6px 4px;">Nenhuma conta cadastrada ainda.</div>';

    var idsJaUsados = {}; CONTAS.forEach(function (c) { idsJaUsados[c.idContaFinanceira] = true; });
    var opcoesDisponiveis = "";
    if (carregandoDisponiveis) {

    } else {

      opcoesDisponiveis = disponiveis.length

          }).join("")

    }

    openModal(
      '<div class="modal-head"><h3>Contas bancárias</h3><button class="btn btn-ghost btn-sm" id="mClose">✕</button></div>' +
      '<div class="modal-body">' +
      '<div style="margin-bottom:18px;">' + cadastradas + "</div>" +
      '<div class="hint-note" style="text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px;">Nova conta</div>' +
      '<div class="field-grid-2">' +
      '<div class="field"><label class="field-label">Conta (Caixas e Bancos, no Bling)</label><select class="plain-select" id="novaContaSel"' + (carregandoDisponiveis ? " disabled" : "") + ">" + opcoesDisponiveis + "</select></div>" +
      '<div class="field"><label class="field-label">Apelido</label><input class="plain-input" id="novaContaApelido" placeholder="ex: SICOOB CJ" /></div>' +
      "</div>" +

      "</div>" +
      '<div class="modal-foot"><span></span><button class="btn btn-primary" id="btnAddConta"' + (carregandoDisponiveis ? " disabled" : "") + '>+ Adicionar conta</button></div>'
    );
    $("mClose").addEventListener("click", function () { closeModal(); carregarContas(); });
    var sel = $("novaContaSel");

        }).then(function (contas) {

          showToast("Conta adicionada.");
          renderGerenciarContasModal(false);

    document.querySelectorAll("[data-remover-conta]").forEach(function (btn) {

        if (!confirm('Remover "' + (c ? c.apelido : id) + '"? O extrato já buscado NÃO é apagado do disco, só some da lista.')) return;
        api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + id, { method: "DELETE" }).then(function () {
          return api("/cuff-bancaria/empresas/" + empresaId + "/contas");

    document.querySelectorAll("[data-conta-toggle]").forEach(function (head) {

  /* =========================================================
     GRADE DE MESES
     ========================================================= */
  function carregarMeses() {
    view = "meses";
    setLargura(false);
    $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Carregando meses…</div></div>';
    var cId = contaId;
    api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + cId + "/" + ano + "/meses").then(function (meses) {
      if (cId !== contaId) return;
      mesesComDados = meses;
      renderMeses();
    }).catch(function (err) {
      $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Erro: ' + escapeHtml(err.message) + "</div></div>";
    });
  }

  function renderMeses() {
    var conta = CONTAS.filter(function (c) { return c.id === contaId; })[0];
    var temDados = {}; mesesComDados.forEach(function (m) { temDados[m] = true; });
    // Mesmo padrão da MIB ("Escolha o mês"): o card inteiro é clicável e
    // leva pro mês (que aí sim mostra "Buscar do Bling" se ainda não tiver
    // nada) -- não tem botão de ação solto no card.
    var cards = MONTHS.map(function (m) {
      var mm = m[0], nome = m[1], tem = !!temDados[mm], carregandoMes = !!buscando[mm];
      return '<div class="month-card' + (tem ? " tem-dados" : "") + '" data-mes-card="' + mm + '"' + (carregandoMes ? "" : ' style="cursor:pointer;"') + '>' +
        '<div class="mes-nome">' + nome + '</div>' +
        '<div class="mes-status' + (tem ? " ok" : "") + '"><span class="dot"></span>' + (tem ? "Conciliação salva" : "Sem conciliação") + "</div>" +
        (carregandoMes ? '<div class="mes-carregando"><span class="spinner"></span>Buscando no Bling…</div>' : "") +
        "</div>";
    }).join("");
    $("mainInner").innerHTML =
      '<div class="page-head"><div>' +
      '<p class="page-eyebrow">' + escapeHtml(empresaNome) + (conta ? " · " + escapeHtml(conta.apelido) : "") + "</p>" +
      '<h1 class="page-title">Escolha o mês</h1></div></div>' +
      '<div class="card">' +
      '<div class="card-head"><div class="year-nav">' +
      '<button class="btn btn-ghost btn-sm" id="anoAnterior">‹</button>' +
      '<span class="year-label">' + ano + '</span>' +
      '<button class="btn btn-ghost btn-sm" id="anoProximo">›</button></div>' +
      '<button class="btn btn-ghost btn-sm" id="btnSincronizarTudo" title="Busca todos os meses do ano no Bling">🔄 Sincronizar tudo</button>' +
      "</div>" +
      '<div class="card-body"><div class="month-grid">' + cards + "</div></div></div>";

    $("anoAnterior").addEventListener("click", function () { ano--; carregarMeses(); });
    $("anoProximo").addEventListener("click", function () { ano++; carregarMeses(); });
    document.querySelectorAll("[data-mes-card]").forEach(function (card) {
      card.addEventListener("click", function () { abrirExtrato(card.getAttribute("data-mes-card")); });
    });
    $("btnSincronizarTudo").addEventListener("click", sincronizarTodosMeses);
  }

  function buscarMes(mm, semMarcar) {
    var cId = contaId, anoAtual = ano;
    return api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + cId + "/" + anoAtual + "/" + mm + "/buscar", { method: "POST" }).then(function (r) {
      if (!semMarcar) marcarImportacaoCentral(anoAtual, mm); // nova importação de 1 mês: a Central abre nesse mês
      return r;
    });
  }

  // "🔄 Sincronizar tudo" -- busca os 12 meses do ano corrente de uma vez,
  // um por um (mesma ideia do botão da MIB), sem precisar abrir mês por mês.
  function sincronizarTodosMeses() {
    if (!confirm("Buscar os 12 meses de " + ano + " no Bling agora (substitui o que já tiver de cada um)?")) return;
    var cId = contaId, anoAtual = ano;
    var mm = 1;
    setStatus("busy", "Sincronizando " + MONTH_NAME["1"] + "/" + anoAtual + "…");
    function proximo() {
      if (cId !== contaId || anoAtual !== ano) return;
      if (mm > 12) { setStatus("ok", "Pronto."); showToast("Sincronização concluída."); carregarMeses(); return; }
      setStatus("busy", "Sincronizando " + MONTH_NAME[String(mm)] + "/" + anoAtual + "…");
      buscarMes(String(mm), true).then(function () { mm++; proximo(); }).catch(function (err) {
        setStatus("warn", "Erro em " + MONTH_NAME[String(mm)] + ": " + err.message);
        mm++; proximo();
      });
    }
    proximo();
  }

    view = "extrato";
    mesAberto = mm;
    setLargura(true);

    api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + contaId + "/" + ano + "/" + mm).then(function (doc) {

  var xVermelho = '<span style="color:var(--danger);font-weight:800;" title="Sem conta no sistema cadastrada">✕</span>';

  function linhaLancamento(l, contextoConta, contaSistemaConta) {
    // Linha de tabela compartilhada entre o Extrato (1 conta) e a Central de
    // Lançamentos (todas as contas) -- `contextoConta` só aparece na
    // Central. Débito/Crédito são as CONTAS (código da "Conta no sistema"
    // cadastrada em Gerenciar), igual à MIB: o lado do banco mostra o
    // código, o outro lado fica pendente (✕) até ter uma conta contábil de
    // verdade pra contrapartida (o Cuff ainda não tem isso). "Categoria" é
    // coluna própria, separada -- é a categoria que já vem pronta do Bling.
    var ent = l.debCred === "C";
    var celBanco = contaSistemaConta ? escapeHtml(contaSistemaConta) : xVermelho;
    var celDebito = "<td>" + (ent ? celBanco : xVermelho) + "</td>";
    var celCredito = "<td>" + (ent ? xVermelho : celBanco) + "</td>";
    var celCategoria = "<td>" + escapeHtml(formatarTexto(l.categoriaPropria || l.categoria)) + "</td>";
    var vinculado = !!l.vinculoControleId;
    var iconeVinculo = l._separado ? "" : vinculado
      ? '<button class="link-btn linked" data-desvincular="' + escapeAttr(l.id) + '" title="Vinculado -- clique pra desvincular">🔗</button>'
      : (ent ? "" : '<button class="link-btn unlinked" data-vincular="' + escapeAttr(l.id) + '" title="Vincular a uma parcela de empréstimo">🔗</button>');
    if (COMP_VINC[l.id]) iconeVinculo += '<button class="link-btn" data-comprovante="' + escapeAttr(l.id) + '" title="' + escapeAttr(ComprovantesVinculo.resumo(COMP_VINC[l.id])) + '">📎</button>';
    return "<tr>" +
      (contextoConta ? "<td>" + escapeHtml(contextoConta) + "</td>" : "") +
      "<td>" + isoToBR(l.data) + "</td>" +
      celDebito + celCredito + celCategoria +
      '<td class="wrap">' + historicoResolvido(l) + "</td>" +
      '<td class="num mono ' + (ent ? "valor-entrada" : "valor-saida") + '">' + (ent ? "+ " : "− ") + fmtBRL.format(Math.abs(l.valor)) + "</td>" +
      '<td class="ctr"><button class="link-btn unlinked" data-criar-regra="' + escapeAttr(l.id) + '" title="Criar regra a partir deste lançamento">➕</button>' + iconeVinculo + "</td>" +
      "</tr>";
  }

  function ligarBotoesCriarRegra(porLancamento) {
    document.querySelectorAll("[data-criar-regra]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var l = porLancamento[btn.getAttribute("data-criar-regra")];
        if (l) abrirModalRegra(null, l.historico, l.debCred, l.categoria);
      });
    });
  }

  var TIPO_REGRA = [["", "Qualquer"], ["D", "Saída"], ["C", "Entrada"]];

  // Salva a lista inteira de regras (PUT) e, se pedido, reprocessa os meses
  // já buscados na hora -- diferente da MIB (que recalcula a conta contábil
  // ao vivo na Central, sem precisar "reprocessar" nada): aqui a
  // categoriaPropria/historicoPadrao ficam gravadas no LancamentoCuff no
  // momento da busca (ver routes/cuffBancaria.ts aplicarRegras), então uma
  // regra nova só reflete nos meses já salvos depois desse passo extra.
  function salvarRegrasCuff(novasRegras, silencioso) {
    return api("/cuff-bancaria/empresas/" + empresaId + "/regras", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(novasRegras),
    }).then(function (regras) {
      REGRAS = regras;
      return api("/cuff-bancaria/empresas/" + empresaId + "/regras/reprocessar", { method: "POST" });
    }).then(function () {
      if (!silencioso) renderRegras();
      return REGRAS;
    }).catch(function (err) { showToast("Não deu pra salvar: " + err.message); });
  }

  // Regra ativa que bateria HOJE num lançamento da Central -- mesma lógica
  // do regraBate do servidor (routes/cuffBancaria.ts), portada pro cliente
  // só pra calcular "Usos" na página de Regras.
  function regraCuffBate(regra, l, contaId) {
    if (!regra.ativa) return false;
    if (regra.tipo && regra.tipo !== l.debCred) return false;
    if (regra.contaId && regra.contaId !== contaId) return false;
    if (regra.valor != null && regra.valor !== "") {
      if (Math.abs(Math.abs(l.valor) - Number(regra.valor)) > 0.005) return false;
      if (!regra.texto) return true;
    }
    var alvo = (l.historico || "").toLowerCase();
    var texto = (regra.texto || "").toLowerCase();
    switch (regra.modo) {
      case "contem": return alvo.indexOf(texto) !== -1;
      case "comeca": return alvo.indexOf(texto) === 0;
      case "termina": return texto === "" ? false : alvo.slice(-texto.length) === texto;
      case "exato": return alvo === texto;
      case "regex":
        try { return new RegExp(regra.texto, "i").test(l.historico || ""); } catch (e) { return false; }
      default: return false;
    }
  }
  function regraSugeridaParaCuff(l) {
    var ativasOrdenadas = REGRAS.filter(function (r) { return r.ativa; }).sort(function (a, b) { return a.ordem - b.ordem; });
    for (var i = 0; i < ativasOrdenadas.length; i++) {
      if (regraCuffBate(ativasOrdenadas[i], l, l.contaId)) return ativasOrdenadas[i];
    }
    return null;
  }
  /** Quantos lançamentos já salvos (sem vínculo de parcela -- esses já têm
   * outra origem de resolução) cada regra classificaria hoje, na ordem de
   * prioridade atual. Só faz sentido com CENTRAL_LINHAS carregado. */
  function calcularUsosPorRegra() {
    var usos = {};
    (CENTRAL_LINHAS || []).forEach(function (l) {
      if (l.vinculoControleId) return;
      var r = regraSugeridaParaCuff(l);
      if (r) usos[r.id] = (usos[r.id] || 0) + 1;
    });
    return usos;
  }

  function moverRegra(id, direcao) {
    var visiveis = REGRAS.filter(function (r) { return r.tipo === REGRAS_TAB; }).sort(function (a, b) { return a.ordem - b.ordem; });
    var idx = visiveis.findIndex(function (r) { return r.id === id; });
    var vizinho = direcao === "up" ? visiveis[idx - 1] : visiveis[idx + 1];
    if (idx === -1 || !vizinho) return;
    var atual = visiveis[idx];
    var ordemAtual = atual.ordem, ordemVizinho = vizinho.ordem;
    var novasRegras = REGRAS.map(function (r) {
      if (r.id === atual.id) return Object.assign({}, r, { ordem: ordemVizinho });
      if (r.id === vizinho.id) return Object.assign({}, r, { ordem: ordemAtual });
      return r;
    });
    salvarRegrasCuff(novasRegras, true).then(function () { renderRegras(); });
  }

  function exportarRegrasJson() {
    var blob = new Blob([JSON.stringify(REGRAS, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "regras-cuff-" + empresaId + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function importarRegrasJson(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var novas = JSON.parse(reader.result);
        if (!Array.isArray(novas)) throw new Error("Devia ser uma lista de regras.");
        var baseOrdem = REGRAS.length;
        novas.forEach(function (r, i) { r.id = uid(); r.ordem = baseOrdem + i; });
        salvarRegrasCuff(REGRAS.concat(novas), true).then(function () {
          renderRegras();
          showToast(novas.length + " regra(s) importada(s).");
        });
      } catch (e) { showToast("Arquivo inválido: " + e.message); }
    };
    reader.readAsText(file);
  }

  /** Modal de regra -- serve pra criar (regraExistente null, aberto pelo
   * "+ Nova regra" da lista OU pelo ➕ de um lançamento no Extrato/Central)
   * e pra editar (regraExistente preenchido, aberto por duplo clique numa
   * linha da lista) -- mesmo modelo da MIB (abrirModalRegra), só sem o
   * campo "Onde comparar" (extrato/relatório) que a MIB tem e o Cuff não. */
  // "3.100,00" / "3100" / "3100.5" -> número (módulo); vazio/inválido -> null
  function lerValorRegra(txt) {
    var t = String(txt || "").trim();
    if (!t) return null;
    if (t.indexOf(",") !== -1) t = t.replace(/./g, "").replace(",", ".");
    var v = parseFloat(t);
    return isNaN(v) ? null : Math.abs(v);
  }
  function abrirModalRegra(regraExistente, historicoInicial, tipoInicial, categoriaInicial) {
    var editando = !!regraExistente;
    var contasOpcoes = '<option value="">Todas as contas</option>' +
      CONTAS.map(function (c) { return '<option value="' + c.id + '"' + (editando && regraExistente.contaId === c.id ? " selected" : "") + ">" + escapeHtml(c.apelido) + "</option>"; }).join("");
    openModal(
      '<div class="modal-head"><h3>' + (editando ? "Editar regra" : "Criar regra") + '</h3>' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
      '<label class="check-inline"><input type="checkbox" id="novaRegraAtiva"' + (!editando || regraExistente.ativa ? " checked" : "") + ' /> Ativa</label>' +
      '<button class="btn btn-ghost btn-sm" id="mClose">✕</button></div></div>' +
      '<div class="modal-body" style="display:flex;flex-direction:column;gap:0;">' +
      '<div class="form-section">' +
      '<p class="form-section-title">O que identificar</p>' +
      '<div class="field" style="margin-bottom:12px;"><label class="field-label">Histórico</label><input class="plain-input" id="novaRegraTexto" value="' + escapeAttr(editando ? regraExistente.texto : (historicoInicial || "")) + '" /></div>' +
      '<div class="field" style="margin-bottom:12px;"><label class="field-label">Comparação</label>' + pillGroup("grupoModoLanc", MODOS_REGRA, editando ? regraExistente.modo : "contem") + "</div>" +
      '<div class="field" style="margin-bottom:0;"><label class="field-label">Valor <span style="text-transform:none;font-weight:500;color:var(--faint);">(opcional -- só bate se o valor for exatamente esse, ex.: 3.100,00)</span></label><input class="plain-input mono" id="novaRegraValor" placeholder="Ex: 3100" style="max-width:200px;" value="' + escapeAttr(editando && regraExistente.valor != null ? String(regraExistente.valor).replace(".", ",") : "") + '" /></div>' +
      "</div>" +
      '<div class="form-section">' +
      '<p class="form-section-title">Histórico padrão <span style="text-transform:none;font-weight:500;letter-spacing:normal;color:var(--faint);">(opcional)</span></p>' +

  function abrirVincularModal(lancamentoId, onde) {
    carregarEmprestimos().then(function (emprestimos) {
      var ativos = emprestimos.filter(function (e) { return e.ativo; });
      if (!ativos.length) {
        showToast("Nenhum empréstimo cadastrado em Controles ainda.");
        return;
      }
      var opcoesEmp = ativos.map(function (e) { return '<option value="' + e.id + '">' + escapeHtml(e.apelido) + "</option>"; }).join("");
      openModal(
        '<div class="modal-head"><h3>Vincular a uma parcela</h3><button class="btn btn-ghost btn-sm" id="mClose">✕</button></div>' +
        '<div class="modal-body">' +
        '<div class="field"><label class="field-label">Empréstimo</label><select class="plain-select" id="vincEmprestimo">' + opcoesEmp + "</select></div>" +
        '<div class="field"><label class="field-label">Parcela nº</label><input class="plain-input mono" id="vincParcela" type="number" min="1" /></div>' +
        "</div>" +
        '<div class="modal-foot"><button class="btn btn-primary" id="btnConfirmarVinculo">Vincular</button></div>'
      );
      var selEmp = $("vincEmprestimo");
      function sugerirParcela() {
        var emp = ativos.filter(function (e) { return e.id === selEmp.value; })[0];
        if (!emp) return;
        var pagas = {}; (emp.pagamentos || []).forEach(function (p) { pagas[p.numero] = true; });
        var n = 1; while (pagas[n] && n <= emp.parcelas) n++;
        $("vincParcela").value = n;
      }
      selEmp.addEventListener("change", sugerirParcela);
      sugerirParcela();
      $("mClose").addEventListener("click", closeModal);
      $("btnConfirmarVinculo").addEventListener("click", function () {
        var parcela = Number($("vincParcela").value);
        if (!parcela || parcela < 1) { showToast("Informe o número da parcela."); return; }
        api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + onde.contaId + "/" + onde.ano + "/" + onde.mes + "/vincular", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lancamentoId: lancamentoId, emprestimoId: selEmp.value, parcela: parcela }),
        }).then(function () {
          EMPRESTIMOS = null; // pagamentos mudaram -- recarrega na próxima
          closeModal();
          showToast("Vinculado.");
          if (secao === "extrato") abrirExtrato(mesAberto); else carregarCentral(true);
        }).catch(function (err) { showToast("Não deu pra vincular: " + err.message); });
      });
    }).catch(function (err) { showToast("Não deu pra carregar os empréstimos: " + err.message); });
  }

  function renderExtrato() {
    var conta = CONTAS.filter(function (c) { return c.id === contaId; })[0];
    if (!docAtual) {
      // Ainda nunca buscou esse mês (diferente de "buscou e veio vazio") --
      // mesmo espírito da MIB: o mês só ganha dados quando o usuário pede.
      $("mainInner").innerHTML =
        '<div class="page-head"><div>' +
        '<a class="voltar-hub" href="#" id="voltarMesesLink" style="margin-bottom:8px;display:inline-flex;">← Voltar pros meses</a>' +
        '<p class="page-eyebrow">' + escapeHtml(empresaNome) + " · " + escapeHtml(conta ? conta.apelido : "") + "</p>" +
        '<h1 class="page-title">' + MONTH_NAME[mesAberto] + "/" + ano + "</h1></div></div>" +
        '<div class="card"><div class="card-body" style="text-align:center;padding:44px 20px;">' +
        '<p style="font-weight:600;margin:0 0 6px;">Esse mês ainda não foi buscado</p>' +
        '<p class="hint-note" style="margin:0 0 16px;">Busca os lançamentos de "Caixas e Bancos" dessa conta direto no Bling.</p>' +
        '<button class="btn btn-primary" id="btnBuscarBling">Buscar do Bling</button>' +
        "</div></div>";
      $("voltarMesesLink").addEventListener("click", function (e) { e.preventDefault(); view = "meses"; renderMeses(); });
      $("btnBuscarBling").addEventListener("click", function () {
        setStatus("busy", "Buscando…");
        buscarMes(mesAberto).then(function (doc) {
          docAtual = doc;
          setStatus("ok", "Pronto.");
          showToast(doc.lancamentos.length + " lançamento(s) buscado(s).");
          renderExtrato();
        }).catch(function (err) { setStatus("warn", "Erro."); showToast("Não deu pra buscar: " + err.message); });
      });
      return;
    }
    var lancamentos = (docAtual && docAtual.lancamentos) || [];
    var entradas = 0, saidas = 0;
    lancamentos.forEach(function (l) { if (l.debCred === "C") entradas += l.valor; else saidas += l.valor; });
    var saldo = entradas - saidas;
    var vinculados = lancamentos.filter(function (l) { return l.vinculoControleId; }).length;
    var pendentes = lancamentos.filter(function (l) { return l.debCred === "D" && !l.vinculoControleId; }).length;

    // Mesma estrutura da MIB: page-head + kpi-row + "Arquivos do mês" -- só
    // muda a origem dos dados (Bling em vez de PDF/SuperLógica) e, por não
    // ter relatório contábil pra casar, os KPIs viram Lançamentos/Entradas/
    // Saídas/Saldo/Vinculados/Pendentes em vez de Extrato/Relatório/
    // Vínculos/Pendentes extrato/Pendentes relatório/Diferença de soma.
    var kpis =
      '<div class="kpi-row">' +
      '<div class="kpi"><div class="kpi-label">Lançamentos</div><div class="kpi-value">' + lancamentos.length + "</div></div>" +
      '<div class="kpi ok"><div class="kpi-label">Entradas</div><div class="kpi-value">' + fmtBRL.format(entradas) + "</div></div>" +
      '<div class="kpi danger"><div class="kpi-label">Saídas</div><div class="kpi-value">' + fmtBRL.format(saidas) + "</div></div>" +
      '<div class="kpi ' + (saldo < 0 ? "danger" : "ok") + '"><div class="kpi-label">Saldo do mês</div><div class="kpi-value">' + fmtBRL.format(saldo) + "</div></div>" +
      '<div class="kpi ok"><div class="kpi-label">Vinculados</div><div class="kpi-value">' + vinculados + "</div></div>" +
      '<div class="kpi' + (pendentes ? " warn" : "") + '"><div class="kpi-label">Pendentes</div><div class="kpi-value">' + pendentes + "</div></div>" +
      "</div>";

    var arquivos =
      '<div class="card">' +
      '<div class="card-head"><h2>Lançamentos do mês</h2>' +
      '<button class="btn btn-sm" id="btnAtualizarExtrato">↻ Atualizar do Bling</button></div>' +
      '<div class="card-body">' +
      '<div class="attach-grid">' +
      '<div class="attach-card tem-arquivo"><div class="attach-icon">🏦</div>' +
      '<div class="attach-info"><div class="attach-label">Extrato — ' + escapeHtml(conta ? conta.apelido : "") + " (Bling)</div>" +
      '<div class="attach-file">' + (docAtual && docAtual.buscadoEm ? "Buscado em " + new Date(docAtual.buscadoEm).toLocaleString("pt-BR") : "") + "</div></div>" +
      '<button class="btn btn-sm" id="btnTrocarExtrato">Trocar</button></div>' +
      "</div></div></div>";

    var ordenados = lancamentos.slice().sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
    var linhas = ordenados.map(function (l) { return linhaLancamento(l, null, conta && conta.contaSistema); }).join("")
      || '<tr><td colspan="7"><div class="empty-state">Nenhum lançamento nesse mês.</div></td></tr>';

    $("mainInner").innerHTML =
      '<div class="page-head"><div>' +
      '<a class="voltar-hub" href="#" id="voltarMesesLink" style="margin-bottom:8px;display:inline-flex;">← Voltar pros meses</a>' +
      '<p class="page-eyebrow">' + escapeHtml(empresaNome) + " · " + escapeHtml(conta ? conta.apelido : "") + "</p>" +
      '<h1 class="page-title">' + MONTH_NAME[mesAberto] + "/" + ano + "</h1></div></div>" +
      kpis + arquivos +
      '<div class="card"><div class="table-scroll"><table><thead><tr><th>Data</th><th>Débito</th><th>Crédito</th><th>Categoria</th><th>Histórico</th><th class="num">Valor</th><th class="ctr">—</th></tr></thead><tbody>' +
      linhas + "</tbody></table></div></div>";

    $("voltarMesesLink").addEventListener("click", function (e) { e.preventDefault(); view = "meses"; renderMeses(); });
    function atualizarExtrato() {
      setStatus("busy", "Buscando…");
      buscarMes(mesAberto).then(function (doc) {
        docAtual = doc;
        setStatus("ok", "Pronto.");
        showToast("Extrato atualizado.");
        renderExtrato();
      }).catch(function (err) { setStatus("warn", "Erro."); showToast("Não deu pra atualizar: " + err.message); });
    }
    $("btnAtualizarExtrato").addEventListener("click", atualizarExtrato);
    $("btnTrocarExtrato").addEventListener("click", atualizarExtrato);
    var mapaOnde = {}, porLancamento = {};
    lancamentos.forEach(function (l) { mapaOnde[l.id] = { contaId: contaId, ano: ano, mes: mesAberto }; porLancamento[l.id] = l; });
    ligarBotoesVinculo(mapaOnde);
    ligarBotoesCriarRegra(porLancamento);
    document.querySelectorAll("[data-comprovante]").forEach(function (b) {
      b.addEventListener("click", function () { var c = COMP_VINC[b.getAttribute("data-comprovante")]; if (c) ComprovantesVinculo.abrirDetalhe(c); });
    });

  /* =========================================================
     CENTRAL DE LANÇAMENTOS -- todas as contas, todos os meses

  function carregarCentral(mantendoFiltros) {
    secao = "central";
    setLargura(true);
    if (!mantendoFiltros) $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Carregando lançamentos…</div></div>';
    Promise.all([api("/cuff-bancaria/empresas/" + empresaId + "/central"), ComprovantesVinculo.carregar("cuff", empresaId)]).then(function (r) {
      CENTRAL_LINHAS = r[0];
      COMPROVANTES = r[1];
      recalcularVinculosComprovantes();
      renderCentral();
    }).catch(function (err) {
      $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Erro: ' + escapeHtml(err.message) + "</div></div>";
    });
  }

  function filtrosCentralVazios() { return { contaId: "", busca: "", tipo: "", de: "", ate: "", valorMin: "", valorMax: "", pendentes: false }; }

  function passaNoValor(valorAbs, min, max) {
    if (min && valorAbs < parseFloat(min.replace(",", ".")) - 0.001) return false;
    if (max && valorAbs > parseFloat(max.replace(",", ".")) + 0.001) return false;
    return true;
  }

  // `ignorarPendentes` -- pula o filtro "Mostrar só pendentes" mesmo que
  // esteja marcado. Usado só pra calcular o contador ao lado do checkbox
  // (ver renderCentral/pendentesTotal): sem isso, o número vinha de TODOS
  // os lançamentos, ignorando Conta/Tipo/De/Até/busca/valor -- confuso
  // quando os filtros já reduziram a tela (pedido do Izaias, 12/09/2026:
  // "quero que liste ali somente o da tela, não geral").
  function linhasFiltradasCentral(ignorarPendentes) {
    var f = CENTRAL_FILTROS;
    salvarDatasCentral();
    return (CENTRAL_LINHAS || []).filter(function (l) {
      if (f.contaId && l.contaId !== f.contaId) return false;
      if (f.tipo && l.debCred !== f.tipo) return false;
      if (f.de && l.data < f.de) return false;
      if (f.ate && l.data > f.ate) return false;
      if (!passaNoValor(Math.abs(l.valor), f.valorMin, f.valorMax)) return false;
      if (!ignorarPendentes && f.pendentes && l.vinculoControleId) return false;
      if (f.busca) {
        var alvo = (l.historico + " " + l.categoria + " " + (l.contatoNome || "")).toLowerCase();
        if (alvo.indexOf(f.busca.toLowerCase()) === -1) return false;
      }
      return true;
    }).sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  }

  // Mesmas rotas compartilhadas que a MIB usa (/exportar/xlsx, csv, txt --
  // ver server/src/routes/exportacao.ts, genéricas, não são específicas de
  // nenhum motor). D/C aqui é o mesmo critério da tela: o lado do banco é
  // a "Conta no sistema" cadastrada, o outro lado leva a categoria (não tem
  // conta contábil de contrapartida de verdade ainda, ver linhaLancamento).
  function exportarCentralLancamentos(caminho, extensao, paraDominio) {
    var linhas = linhasFiltradasCentral();
    if (!linhas.length) return;
    var contaSistemaPorId = {}; CONTAS.forEach(function (c) { contaSistemaPorId[c.id] = c.contaSistema || ""; });
    var linhasExport = linhas.map(function (l) {
      var contaBanco = contaSistemaPorId[l.contaId] || "";
      var categoriaTxt = formatarTexto(l.categoriaPropria || l.categoria);
      var ent = l.debCred === "C";
      return {
        origem: l.contaApelido, data: isoToBR(l.data),
        debito: ent ? contaBanco : categoriaTxt, credito: ent ? categoriaTxt : contaBanco,
        historico: historicoResolvido(l), valor: l.valor,
      };
    });
    function pedirTxt() {
      return fetch("/api" + caminho, { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lancamentos: linhasExport }) })
        .then(function (resp) { if (!resp.ok) throw new Error("Falha ao exportar."); return resp.blob(); });
    }
    if (paraDominio) {
      LancarDominio.lancar({ modulo: "cuff", empresaId: empresaId, empresaNome: (typeof empresaNome === "function" ? empresaNome(empresaId) : "") || empresaId, quantidade: linhasExport.length,
        obterTxt: function () { return pedirTxt().then(function (blob) { return blob.text(); }); } });
      return;
    }
    pedirTxt()
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "central-lancamentos-" + empresaId + "." + extensao;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }).catch(function () { showToast("Não deu pra exportar."); });
  }

  function renderCentral() {
    var f = CENTRAL_FILTROS;
    var filtradas = linhasFiltradasCentral();
    var somaTotal = filtradas.reduce(function (s, l) { return s + l.valor; }, 0);
    var pendentesTotal = linhasFiltradasCentral(true).filter(function (l) { return l.debCred === "D" && !l.vinculoControleId; }).length;
    var filtroAtivo = f.contaId || f.tipo || f.de || f.ate || f.busca || f.valorMin || f.valorMax || f.pendentes;

    var opcoesContas = '<option value="">Todas as contas</option>' + CONTAS.map(function (c) {
      return '<option value="' + c.id + '"' + (f.contaId === c.id ? " selected" : "") + ">" + escapeHtml(c.apelido) + "</option>";
    }).join("");

    var contaSistemaPorId = {}; CONTAS.forEach(function (c) { contaSistemaPorId[c.id] = c.contaSistema; });
    var linhas = filtradas.map(function (l) { return linhaLancamento(l, l.contaApelido, contaSistemaPorId[l.contaId]); }).join("")
      || '<tr><td colspan="8"><div class="empty-state">Nenhum lançamento com esses filtros.</div></td></tr>';

    $("mainInner").innerHTML =
      '<div class="card-head" style="border-bottom:none;padding-bottom:0;"><h2>Central de Lançamentos</h2>' +
      '<div style="display:flex;gap:8px;"><button class="btn btn-sm" id="btnVincularTudo">🔗 Vincular tudo</button></div></div>' +
      '<div class="card">' +
      '<div class="card-head"><h2>Filtros</h2>' + (filtroAtivo ? '<button class="btn btn-ghost btn-sm" id="btnLimparFiltros">✕ Limpar filtros</button>' : "") + "</div>" +
      '<div class="filtros-row">' +
      '<div class="field"><label class="field-label">Conta</label><select class="plain-select" id="fConta">' + opcoesContas + "</select></div>" +
      '<div class="field"><label class="field-label">Tipo</label><select class="plain-select" id="fTipo">' +
      '<option value=""' + (!f.tipo ? " selected" : "") + '>Todos</option>' +
      '<option value="C"' + (f.tipo === "C" ? " selected" : "") + '>Entradas</option>' +
      '<option value="D"' + (f.tipo === "D" ? " selected" : "") + ">Saídas</option></select></div>" +
      '<div class="field"><label class="field-label">De</label><input class="plain-input" id="fDe" type="date" value="' + escapeAttr(f.de) + '" /></div>' +
      '<div class="field"><label class="field-label">Até</label><input class="plain-input" id="fAte" type="date" value="' + escapeAttr(f.ate) + '" /></div>' +
      '<div class="field grow"><label class="field-label">Buscar no histórico</label><input class="plain-input" id="fBusca" placeholder="Ex: aluguel, sicoob..." value="' + escapeAttr(f.busca) + '" /></div>' +
      '<div class="field" style="min-width:90px;"><label class="field-label">Valor mín.</label><input class="plain-input" id="fValorMin" placeholder="0,00" value="' + escapeAttr(f.valorMin) + '" /></div>' +
      '<div class="field" style="min-width:90px;"><label class="field-label">Valor máx.</label><input class="plain-input" id="fValorMax" placeholder="0,00" value="' + escapeAttr(f.valorMax) + '" /></div>' +
      "</div>" +
      '<div class="filtros-row" style="border-top:1px solid var(--border);">' +
      '<label class="check-inline"><input type="checkbox" id="fPendentes"' + (f.pendentes ? " checked" : "") + ' /> ⚠ Mostrar só pendentes (' + pendentesTotal + ")</label>" +
      '<span style="flex:1;"></span>' +
      '<button class="btn btn-ghost btn-sm" id="btnExportarExcel"' + (filtradas.length ? "" : " disabled") + '>⬇ Excel</button>' +
      '<button class="btn btn-ghost btn-sm" id="btnExportarCsv"' + (filtradas.length ? "" : " disabled") + ">⬇ CSV</button>" +
      '<button class="btn btn-ghost btn-sm" id="btnExportarTxt"' + (filtradas.length ? "" : " disabled") + ">⬇ TXT</button>" +
      '<button class="btn btn-ghost btn-sm" id="btnLancarDominio"' + (filtradas.length ? "" : " disabled") + ' title="Manda esses lançamentos direto pro Domínio (robô na sua máquina). Para no Resumo dos Dados -- você confere e grava.">🚀 Lançar no Domínio</button>' +
      "</div>" +
      '<div class="hint-note" style="display:flex;justify-content:space-between;padding:10px 16px;">' +
      "<span>" + filtradas.length + " de " + (CENTRAL_LINHAS || []).length + " lançamento(s)</span>" +
      '<span>Total: <b class="mono">' + fmtBRL.format(somaTotal) + "</b></span></div>" +
      '<div class="table-scroll"><table><thead><tr><th>Conta</th><th>Data</th><th>Débito</th><th>Crédito</th><th>Categoria</th><th>Histórico</th><th class="num">Valor</th><th class="ctr">—</th></tr></thead><tbody>' +
      linhas + "</tbody></table></div>" +
      "</div>";

    $("btnVincularTudo").addEventListener("click", vincularTudo);
    var limpar = $("btnLimparFiltros");
    if (limpar) limpar.addEventListener("click", function () { CENTRAL_FILTROS = filtrosCentralVazios(); renderCentral(); });
    ["fConta", "fTipo", "fPendentes"].forEach(function (id) {
      $(id).addEventListener("change", function () {
        f.contaId = $("fConta").value; f.tipo = $("fTipo").value; f.pendentes = $("fPendentes").checked;
        renderCentral();
      });
    });
    // Data: "change" dispara a cada segmento digitado (dia/mês/ano) nesse
    // tipo de input, e como o handler re-renderiza a tela inteira, o campo
    // perdia o foco no meio da digitação -- só atualiza no "blur" (quando o
    // usuário clica fora / sai do campo), igual pediu o usuário.
    ["fDe", "fAte"].forEach(function (id) {
      $(id).addEventListener("blur", function () {
        var novoDe = $("fDe").value, novoAte = $("fAte").value;
        if (novoDe === f.de && novoAte === f.ate) return;
        f.de = novoDe; f.ate = novoAte;
        renderCentral();
      });
    });
    [["fBusca", "busca"], ["fValorMin", "valorMin"], ["fValorMax", "valorMax"]].forEach(function (par) {
      var el = $(par[0]);
      el.addEventListener("input", function () {
        f[par[1]] = el.value;
        clearTimeout(el._t);
        el._t = setTimeout(renderCentral, 250);
      });
    });
    var btnExcel = $("btnExportarExcel"); if (btnExcel) btnExcel.addEventListener("click", function () { exportarCentralLancamentos("/exportar/xlsx", "xlsx"); });
    var btnCsv = $("btnExportarCsv"); if (btnCsv) btnCsv.addEventListener("click", function () { exportarCentralLancamentos("/exportar/csv", "csv"); });
    var btnTxt = $("btnExportarTxt"); if (btnTxt) btnTxt.addEventListener("click", function () { exportarCentralLancamentos("/exportar/txt", "txt"); });
    var btnDom = $("btnLancarDominio"); if (btnDom) btnDom.addEventListener("click", function () { exportarCentralLancamentos("/exportar/txt", "txt", true); });
    var mapaOnde = {}, porLancamento = {};
    filtradas.forEach(function (l) { mapaOnde[l.id] = { contaId: l.contaId, ano: l.ano, mes: l.mes }; porLancamento[l.id] = l; });
    ligarBotoesVinculo(mapaOnde);
    ligarBotoesCriarRegra(porLancamento);
    document.querySelectorAll("[data-comprovante]").forEach(function (b) {
      b.addEventListener("click", function () { var c = COMP_VINC[b.getAttribute("data-comprovante")]; if (c) ComprovantesVinculo.abrirDetalhe(c); });
    });
  }

  /* =========================================================
     REGRAS DE CONTA CONTÁBIL -- página cheia (empresa inteira), copiada
     ponto a ponto do Conversor de Extratos (React): mesma linha de
     estatística, mesma pílula de abas, mesmo filtro de banco + busca,
     mesmas colunas da tabela.
     ========================================================= */
  var MODOS_REGRA = [["contem", "contém"], ["comeca", "começa com"], ["termina", "termina com"], ["exato", "é exatamente"], ["regex", "regex"]];

  function carregarRegras() {
    secao = "regras";
    setLargura(true);
    $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Carregando regras…</div></div>';
    Promise.all([
      api("/cuff-bancaria/empresas/" + empresaId + "/regras"),
      api("/cuff-bancaria/empresas/" + empresaId + "/central"),
    ]).then(function (r) {
      REGRAS = r[0];
      CENTRAL_LINHAS = r[1];
      renderRegras();
    }).catch(function (err) {
      $("mainInner").innerHTML = '<div class="card"><div class="loading-inline">Erro: ' + escapeHtml(err.message) + "</div></div>";
    });
  }

  function renderRegras() {
    var usos = calcularUsosPorRegra();
    var abas = [["D", "Saídas"], ["C", "Entradas"], ["", "Ambas"]];
    var tabsHtml = abas.map(function (a) {
      return '<button class="tab-btn' + (REGRAS_TAB === a[0] ? " active" : "") + '" data-regra-tab="' + a[0] + '">' + a[1] + "</button>";
    }).join("");

    var regrasDoBanco = REGRAS_BANCO_FILTRO === "todos" ? REGRAS : REGRAS.filter(function (r) { return !r.contaId || r.contaId === REGRAS_BANCO_FILTRO; });
    var buscaNorm = REGRAS_BUSCA.trim().toUpperCase();
    var visiveis = regrasDoBanco
      .filter(function (r) { return r.tipo === REGRAS_TAB; })
      .filter(function (r) {
        if (!buscaNorm) return true;
        return (r.texto || "").toUpperCase().indexOf(buscaNorm) !== -1 || (r.categoriaPropria || "").toUpperCase().indexOf(buscaNorm) !== -1;
      })
      .sort(function (a, b) { return a.ordem - b.ordem; });

    var linhas = visiveis.map(function (r, idx) {
      var nomeConta = r.contaId ? ((CONTAS.filter(function (c) { return c.id === r.contaId; })[0] || {}).apelido || "Conta removida") : null;
      return "<tr>" +
        '<td class="ctr" style="color:var(--faint);cursor:grab;">⋮⋮</td>' +
        '<td class="ctr"><input type="checkbox" data-toggle-regra="' + escapeAttr(r.id) + '"' + (r.ativa ? " checked" : "") + " /></td>" +
        '<td data-editar-regra="' + escapeAttr(r.id) + '" title="Duplo clique pra editar" style="cursor:pointer;">' + escapeHtml(r.texto) + "</td>" +
        '<td data-editar-regra="' + escapeAttr(r.id) + '" title="Duplo clique pra editar" style="cursor:pointer;">' +
          (r.historicoPadrao ? escapeHtml(r.historicoPadrao) : '<span style="color:var(--muted);">—</span>') + "</td>" +
        '<td data-editar-regra="' + escapeAttr(r.id) + '" title="Duplo clique pra editar" style="cursor:pointer;">' +
          (nomeConta ? escapeHtml(nomeConta) : '<span class="badge badge-muted">Todos</span>') + "</td>" +
        '<td data-editar-regra="' + escapeAttr(r.id) + '" title="Duplo clique pra editar" style="cursor:pointer;">' + escapeHtml(r.categoriaPropria || "—") + "</td>" +
        '<td class="num mono">' + (usos[r.id] || 0) + "</td>" +
        '<td class="ctr">' +
          '<button class="icon-btn" data-mover-regra="' + escapeAttr(r.id) + '" data-dir="up" title="Subir prioridade"' + (idx === 0 ? " disabled" : "") + ">↑</button>" +
          '<button class="icon-btn" data-mover-regra="' + escapeAttr(r.id) + '" data-dir="down" title="Descer prioridade"' + (idx === visiveis.length - 1 ? " disabled" : "") + ">↓</button>" +
          '<button class="icon-btn" data-del-regra="' + escapeAttr(r.id) + '" title="Remover">🗑</button>' +
        "</td></tr>";
    }).join("") || '<tr><td colspan="8"><div class="empty-state">Nenhuma regra nessa aba ainda.</div></td></tr>';

    var totalUsosBanco = regrasDoBanco.reduce(function (soma, r) { return soma + (usos[r.id] || 0); }, 0);
    var contasOpcoesFiltro = CONTAS.map(function (c) {
      return '<option value="' + c.id + '"' + (REGRAS_BANCO_FILTRO === c.id ? " selected" : "") + ">Vale pra " + escapeHtml(c.apelido) + "</option>";
    }).join("");

    $("mainInner").innerHTML =
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;">' +
        '<div><h2 style="margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:-0.65px;line-height:1.2;">Regras contábeis</h2>' +
        '<p class="hint-note" style="margin:4px 0 0;">Contrapartida automática · ' + escapeHtml(empresaNome) + "</p></div>" +
        '<div style="display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--hint);">' +
          '<span><strong style="color:var(--ink);">' + regrasDoBanco.length + "</strong> regras</span>" +
          '<span><strong style="color:var(--ok);">' + regrasDoBanco.filter(function (r) { return r.ativa; }).length + "</strong> ativas</span>" +
          '<span><strong style="color:var(--ink);">' + totalUsosBanco + "</strong> usos nos lançamentos</span>" +
        "</div>" +
      "</div>" +
      '<div class="card" style="margin-top:14px;">' +
        '<div class="card-head" style="flex-wrap:wrap;gap:8px;">' +
        '<div class="tab-bar">' + tabsHtml + "</div>" +
        '<span style="flex:1;"></span>' +
        '<button class="btn btn-ghost btn-sm" id="btnExportarRegras">⬇ Exportar</button>' +
        '<label class="btn btn-ghost btn-sm" style="cursor:pointer;">⬆ Importar<input type="file" accept="application/json" id="inputImportarRegras" style="display:none;" /></label>' +
        '<button class="btn btn-primary btn-sm" id="btnNovaRegra">+ Nova regra</button>' +
        "</div>" +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);">' +
          '<select class="plain-select" id="regrasFiltroBanco"><option value="todos">Todas as regras</option>' + contasOpcoesFiltro + "</select>" +
          '<input class="plain-input" id="regrasBusca" style="flex:1;min-width:200px;" placeholder="Buscar por histórico ou categoria..." value="' + escapeAttr(REGRAS_BUSCA) + '" />' +
        "</div>" +
      "</div>" +
      '<div class="card" style="margin-top:14px;">' +
        '<div class="table-scroll"><table><thead><tr><th class="ctr"></th><th class="ctr"></th><th>Histórico</th><th>Histórico padrão</th><th>Banco</th><th>Categoria</th><th class="num">Usos</th><th class="ctr"></th></tr></thead><tbody>' + linhas + "</tbody></table></div>" +
      "</div>";

    document.querySelectorAll("[data-regra-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { REGRAS_TAB = btn.getAttribute("data-regra-tab"); renderRegras(); });
    });
    document.querySelectorAll("[data-toggle-regra]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var id = chk.getAttribute("data-toggle-regra");
        salvarRegrasCuff(REGRAS.map(function (r) { return r.id === id ? Object.assign({}, r, { ativa: chk.checked }) : r; }), true).then(function () { renderRegras(); });
      });
    });
    document.querySelectorAll("[data-mover-regra]").forEach(function (btn) {
      btn.addEventListener("click", function () { moverRegra(btn.getAttribute("data-mover-regra"), btn.getAttribute("data-dir")); });
    });
    document.querySelectorAll("[data-del-regra]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Remover essa regra?")) return;
        salvarRegrasCuff(REGRAS.filter(function (r) { return r.id !== btn.getAttribute("data-del-regra"); }), true).then(function () { renderRegras(); });
      });
    });
    $("regrasFiltroBanco").addEventListener("change", function () { REGRAS_BANCO_FILTRO = this.value; renderRegras(); });
    $("regrasBusca").addEventListener("input", function () {
      REGRAS_BUSCA = this.value;
      var posCursor = this.selectionStart;
      renderRegras();
      var novoInput = $("regrasBusca");
      novoInput.focus();
      novoInput.setSelectionRange(posCursor, posCursor);
    });
    document.querySelectorAll("[data-editar-regra]").forEach(function (td) {
      td.addEventListener("dblclick", function () {
        var r = REGRAS.filter(function (x) { return x.id === td.getAttribute("data-editar-regra"); })[0];
        if (r) abrirModalRegra(r);
      });
    });
    $("btnNovaRegra").addEventListener("click", function () { abrirModalRegra(null); });
    $("btnExportarRegras").addEventListener("click", exportarRegrasJson);
    $("inputImportarRegras").addEventListener("change", function (ev) { importarRegrasJson(ev.target.files[0]); });
  }

  /* =========================================================
     CONFIGURAÇÕES
     ========================================================= */
  function renderConfiguracoes() {
    secao = "config";
    setLargura(false);
    var HORAS_LABEL = { "": "Desligado (só manual)", "1": "A cada 1h", "3": "A cada 3h", "6": "A cada 6h", "12": "A cada 12h", "24": "A cada 24h" };
    var linhasAuto = CONTAS.map(function (c) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">' +
        '<div><div style="font-weight:700;font-size:13px;">' + escapeHtml(c.apelido) + "</div>" +
        '<div class="hint-note">' + (c.blingUltimoResultado ? escapeHtml(c.blingUltimoResultado) : "Ainda não tentou nenhuma busca automática.") + "</div></div>" +
        '<select class="plain-select" style="max-width:200px;" data-auto-horas-cfg="' + escapeAttr(c.id) + '">' +
        Object.keys(HORAS_LABEL).map(function (h) { return '<option value="' + h + '"' + (String(c.blingAutoHoras || "") === h ? " selected" : "") + ">" + HORAS_LABEL[h] + "</option>"; }).join("") +
        "</select></div>";
    }).join("") || '<p class="hint-note">Nenhuma conta cadastrada ainda.</p>';

    $("mainInner").innerHTML =
      '<div class="card-head" style="border-bottom:none;padding-bottom:0;"><h2>Configurações</h2></div>' +
      '<div class="card"><div class="card-head"><h2>Busca automática — Bling</h2></div><div class="card-body">' + linhasAuto + "</div></div>" +
      '<div class="card"><div class="card-head"><h2>Formatação de texto</h2></div><div class="card-body">' +
      '<p class="hint-note" style="margin-bottom:14px;">Vale pra Categoria/Histórico (Central de Lançamentos, extrato) e pro histórico exportado.</p>' +
      '<label class="check-inline" style="margin-bottom:10px;"><input type="checkbox" id="cfgMaiusculo"' + (CONFIG_TEXTO.maiusculo ? " checked" : "") + " /> Deixar tudo maiúsculo</label><br>" +
      '<label class="check-inline"><input type="checkbox" id="cfgSemEspeciais"' + (CONFIG_TEXTO.semEspeciais ? " checked" : "") + " /> Remover caracteres especiais</label>" +
      "</div></div>" +
      '<div class="card"><div class="card-body">' +
      '<p style="font-weight:600;margin:0 0 4px;">Contas bancárias</p>' +
      '<p class="hint-note" style="margin:0 0 12px;">Escolhe quais contas do Bling (Caixas e Bancos) essa empresa acompanha, o apelido, a conta no sistema e a conta saldo credor de cada uma.</p>' +
      '<button class="btn btn-primary" id="btnGerenciarContasCfg">⚙ Gerenciar contas</button>' +
      "</div></div>";

    $("btnGerenciarContasCfg").addEventListener("click", abrirGerenciarContas);
    document.querySelectorAll("[data-auto-horas-cfg]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        var id = sel.getAttribute("data-auto-horas-cfg");
        api("/cuff-bancaria/empresas/" + empresaId + "/contas/" + id, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ blingAutoHoras: sel.value || null }),
        }).then(function (contas) {
          CONTAS = contas;
          showToast("Busca automática atualizada.");
        }).catch(function (err) { showToast("Não deu pra salvar: " + err.message); });
      });
    });
    $("cfgMaiusculo").addEventListener("change", function () { CONFIG_TEXTO.maiusculo = this.checked; salvarConfigTexto(); showToast("Formatação salva."); });
    $("cfgSemEspeciais").addEventListener("change", function () { CONFIG_TEXTO.semEspeciais = this.checked; salvarConfigTexto(); showToast("Formatação salva."); });
  }

  iniciar();
}
appMain();
</script>
