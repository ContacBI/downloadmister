<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conciliador de tributos</title>
<style>
:root{--bg:#0f1218;--surf:#171b24;--surf2:#1e2430;--line:#2a3140;--tx:#e8ecf4;--mut:#8b95a8;--faint:#5c6577;--brand:#7c8cff;--ok:#38c98b;--warn:#f0b24a;--bad:#ef5b6b;--info:#4cb4e8;--radius:10px;--mono:ui-monospace,Consolas,Menlo,monospace}
:root[data-tema=claro]{--bg:#f4f6fa;--surf:#fff;--surf2:#eef1f7;--line:#d9dfea;--tx:#1b2230;--mut:#5b6679;--faint:#8b95a8;--brand:#4a5bd8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em}
h1 small{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav button:hover:not(.on),.chip:hover:not(.on){color:var(--tx);border-color:var(--faint)}
.sp{flex:1}
select,input[type=search],input[type=text]{background:var(--surf2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
main{padding:18px clamp(12px,2vw,40px) 60px;max-width:none;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--faint);font-size:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mut{color:var(--mut)} .faint{color:var(--faint)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--surf2)}
table.matriz{width:100%;font-size:clamp(12px,.78vw,15px)}.matriz td,.matriz th{padding-top:clamp(6px,.8vh,13px)!important;padding-bottom:clamp(6px,.8vh,13px)!important}.matriz td.cell{cursor:pointer;min-width:74px;white-space:nowrap;border-left:1px solid var(--line)}
.matriz td.cell:hover{outline:1px solid var(--brand);outline-offset:-1px}
.matriz td.sem{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--surf2) 5px 10px);color:var(--faint);cursor:default;text-align:center}
.matriz td.zero{color:var(--faint)}
.matriz td.tot,.matriz th.tot{font-weight:700;border-left:2px solid var(--line)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--bad)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.mini h3{font-size:12px;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em}
.mini table td{padding:3px 6px;font-size:13px}
.arq{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.arq>summary{padding:10px 12px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surf2)}
.arq>div{padding:12px}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.pg{display:flex;gap:6px;align-items:center;margin-top:8px}
.pg button{border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:6px;padding:3px 10px;cursor:pointer}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
.bars{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surf2);min-width:120px}
.bars i{display:block;height:100%}
button.lnk{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
#msg{padding:60px 20px;text-align:center;color:var(--mut)}

.empchips{display:flex;gap:4px}
.empchips .chip{padding:5px 11px}
.grp td{background:var(--surf2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:5px 9px}
.rowlink{cursor:pointer}
.rowlink:hover b{color:var(--brand)}
.spark{width:84px;height:22px;display:block}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi.click:hover{border-color:var(--brand);transform:translateY(-1px)}
th.mes{cursor:pointer}
th.mes:hover{color:var(--brand)}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--mut)}
.crumb button{background:none;border:0;color:var(--brand);cursor:pointer;font:inherit}
svg text{fill:var(--mut);font-size:11px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:6px 0 2px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tag.sel{outline:2px solid var(--brand)}
@media(max-width:700px){header{padding:8px 12px}main{padding:12px 10px 50px}}
dialog{background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:20px}dialog::backdrop{background:#0008}dialog select{margin-left:6px}
.mk{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}.mk b{width:13px;height:13px;border-radius:3px;border:1px solid var(--faint);display:inline-block;font:700 8px/11px system-ui;text-align:center;color:var(--faint);cursor:pointer;font-style:normal}.mk b:hover{border-color:var(--ok);color:var(--ok)}.mk b.t{color:#04140c}td.cell.feito{background:color-mix(in srgb,var(--ok) 30%,transparent)!important}td.cell.feito::after{content:"✔";color:var(--ok);margin-left:4px;font-size:11px}.mk b.p{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}.mk b.t{background:var(--ok);border-color:var(--ok)}
.flags{display:inline-flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}.flags label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}.flags input{accent-color:var(--ok);width:15px;height:15px;cursor:pointer}
.prog{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.prog .pg1{flex:1;min-width:200px;background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}.prog .barra{height:6px;background:var(--surf2);border-radius:4px;overflow:hidden;margin-top:6px}.prog .barra i{display:block;height:100%;background:var(--ok)}
.matriz tr.subtot td{background:var(--surf2);font-weight:700;border-top:1px solid var(--line)}.matriz tr.subtot td.l{color:var(--brand)}
.matriz tr.totgeral td{background:color-mix(in srgb,var(--brand) 18%,var(--surf));font-weight:800;border-top:2px solid var(--brand);font-size:1.08em}
</style>
</head>
<body>
<header>
  <h1>Conciliador de tributos<small id="sub"></small></h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <div class="empchips" id="empChips"></div>
  <label class="mut">Período <select id="selPer"></select></label>
  <button class="chip on" id="btnExp" title="Baixar relação completa (todos os meses, estados e notas)">⬇ Exportar tudo</button>
  <button class="chip" id="btnTema" title="Tema claro/escuro">◐</button>
</header>
<main id="app"><div id="msg">Carregando dados…</div></main>

const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const METRICAS = [
  ["vp", "A recolher (apuração)"], ["deb", "Débitos"], ["cred", "Créditos"], ["ig", "Imposto das notas"], ["sc", "Saldo credor p/ mês seguinte"],
];
const RET_TRI = { "16": "016", "25": "025", "26": "026", "18": "018", "63": "063" };
const S = { emp: "ALL", per: "ANO", view: "painel", metrica: "vp", sel: null, nota: "", retFiltro: "todos", pgNotas: {} };
let D, G = new Map();
// ---- marcações (Importado / Conferido / Pago) por demonstrativo; ficam no navegador + backup em JSON
const FLAGS = [["i", "Importado"], ["c", "Conferido"], ["p", "Pago"]];
let MARC = {};
const chaveM = x => x.e + "|" + x.arq;
const lsKey = () => "conciliador-marcacoes-" + Object.values(D.emps)[0].cnpj;
const marcOf = x => MARC[chaveM(x)] || {};
function salvaMarc() { try { localStorage.setItem(lsKey(), JSON.stringify(MARC)); } catch (e) { } }
function carregaMarc() { try { MARC = JSON.parse(localStorage.getItem(lsKey()) || "{}"); } catch (e) { MARC = {}; } }
function setMarc(arqs, f, val) {
  const agora = new Date().toISOString().slice(0, 16).replace("T", " ");
  for (const x of arqs) { const m = MARC[chaveM(x)] = { ...(MARC[chaveM(x)] || {}) }; if (val) m[f] = agora; else delete m[f]; if (!Object.keys(m).length) delete MARC[chaveM(x)]; }
  salvaMarc();
}
const estadoM = (arqs, f) => { const n = arqs.filter(x => marcOf(x)[f]).length; return n === 0 ? "" : n === arqs.length ? "t" : "p"; };
const marcaMini = (arqs, esc = "") => `<span class="mk" title="${FLAGS.map(([f, n]) => n + ": " + arqs.filter(x => marcOf(x)[f]).length + "/" + arqs.length).join(" · ")}\nClique no quadradinho para marcar/desmarcar tudo (I = importado, C = conferido, P = pago)">${FLAGS.map(([f, n]) => `<b class="${estadoM(arqs, f)}" data-mkc="${f}" ${esc}>${n[0]}</b>`).join("")}</span>`;
function arqsEscopo(tri, c, comps) { return D.demos.filter(x => (S.emp === "ALL" || x.e === S.emp) && (!tri || x.tri === tri) && (c ? x.c === c : comps.includes(x.c))); }
const simM = (x, f) => marcOf(x)[f] ? "Sim" : "";
function refresh() {
  const y = window.scrollY, abertos = [...document.querySelectorAll("#detalhe details.arq")].map(d => d.open);
  render();
  document.querySelectorAll("#detalhe details.arq").forEach((d, i) => { if (i in abertos) d.open = abertos[i]; });
  window.scrollTo(0, y);
}
document.addEventListener("change", e => {
  const el = e.target.closest("input[data-mk]"); if (!el) return;
  const arqs = el.dataset.all ? D.demos.filter(x => S.sel && x.tri === S.sel.tri && x.c === S.sel.c && (S.emp === "ALL" || x.e === S.emp)) : [D.demos[+el.dataset.i]];

const $ = (s, el = document) => el.querySelector(s);

function spark(vals) {
  const v = vals.map(x => x == null ? 0 : x), mx = Math.max(1, ...v.map(Math.abs)), w = 84, h = 22, bw = w / v.length;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}">${v.map((x, i) => `<rect x="${i * bw + 1}" y="${h - Math.max(1, Math.abs(x) / mx * (h - 2)) - 1}" width="${bw - 2}" height="${Math.max(1, Math.abs(x) / mx * (h - 2))}" rx="1.5" fill="${x < 0 ? "var(--bad)" : "var(--brand)"}" opacity="${vals[i] == null ? .15 : .85}"/>`).join("")}</svg>`;
}

async function carregar() {
  const bin = Uint8Array.from(atob(B64), c => c.charCodeAt(0));

  return JSON.parse(txt);
}

// tabela de notas de um demonstrativo, com busca / filtro / ordenação / paginação
function tabelaNotas(el, x) {
  const st = { q: "", sec: "", tipo: "", ord: 4, asc: true, pg: 0 };
  const tipos = [...new Set(x.docs.map(d => d[2]))];
  const secs = [...new Set(x.docs.map(d => d[0] + "|" + d[1]))];
  const POR = 100;
  const dataKey = d => d.split("/").reverse().join("");
  function desenha() {
    let L = x.docs.filter(d => (!st.sec || d[0] + "|" + d[1] === st.sec) && (!st.tipo || d[2] === st.tipo) && (!st.q || (d[3] + " " + d[9]).toLowerCase().includes(st.q)));
    const col = st.ord;
    L = L.slice().sort((a, b) => { const va = col === 4 ? dataKey(a[4]) : a[col], vb = col === 4 ? dataKey(b[4]) : b[col]; return (va > vb ? 1 : va < vb ? -1 : 0) * (st.asc ? 1 : -1); });
    const tot = soma(L, d => d[8]), totVc = soma(L, d => d[5]);
    const pgs = Math.max(1, Math.ceil(L.length / POR)); st.pg = Math.min(st.pg, pgs - 1);
    const pag = L.slice(st.pg * POR, st.pg * POR + POR);
    el.innerHTML = `<div class="bar"><input type="search" placeholder="Buscar nota / cliente…" value="${esc(st.q)}" data-f="q">
      <select data-f="tipo"><option value="">Todos os tipos</option>${tipos.map(t => `<option ${st.tipo === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      ${secs.length > 1 ? `<select data-f="sec"><option value="">Todas as seções</option>${secs.map(s => `<option value="${esc(s)}" ${st.sec === s ? "selected" : ""}>${s.startsWith("D") ? "Débito" : s.startsWith("C") ? "Crédito" : "—"} · ${esc(s.split("|")[1] || "—")}</option>`).join("")}</select>` : ""}
      <span class="sp"></span><span class="mut">${fmt0(L.length)} notas · valor contábil ${fmt(totVc)} · imposto <b>${fmt(tot)}</b>${L.some(d => d[0] === "C") ? ` · <span title="Débitos − créditos (devoluções entram como crédito)">líquido <b>${fmt(soma(L, d => d[0] === "C" ? -d[8] : d[8]))}</b></span>` : ""}</span><button class="chip" data-f="csv">⬇ CSV</button></div>
      <div class="scroll"><table><thead><tr><th class="l" data-o="3">Nota</th><th class="l" data-o="2">Tipo</th><th class="l" data-o="4">Data</th><th class="l">Seção</th><th data-o="5">Valor contábil</th><th data-o="6">Base de cálculo</th><th data-o="7">Alíq. %</th><th data-o="8">Imposto</th><th class="l">Obs.</th></tr></thead><tbody>
      ${pag.map(d => `<tr><td class="l">${esc(d[3])}</td><td class="l">${esc(d[2])}</td><td class="l">${d[4]}</td><td class="l faint">${d[0] === "D" ? "Déb" : d[0] === "C" ? "Créd" : ""} ${esc(d[1])}</td><td>${fmt(d[5])}</td><td>${fmt(d[6])}</td><td>${fmt(d[7])}</td><td class="${cl(d[8])}"><b>${fmt(d[8])}</b></td><td class="l faint">${esc(d[9])}</td></tr>`).join("")}</tbody></table></div>
      <div class="pg"><button data-f="ant">‹</button><span class="mut">página ${st.pg + 1} de ${pgs}</span><button data-f="prox">›</button></div>`;
    el.querySelectorAll("[data-o]").forEach(th => th.style.cursor = "pointer");
  }
  el.onclick = e => {
    const th = e.target.closest("[data-o]"); if (th) { const o = +th.dataset.o; st.asc = st.ord === o ? !st.asc : true; st.ord = o; desenha(); return; }
    const f = e.target.closest("[data-f]")?.dataset.f;
    if (f === "ant") { st.pg = Math.max(0, st.pg - 1); desenha(); }
    if (f === "prox") { st.pg++; desenha(); }
    if (f === "csv") baixarCsv(`notas-${x.e}-${x.tri}-${x.c}.csv`, [["Seção", "Movimento", "Tipo", "Nota", "Data", "Valor contábil", "Base", "Alíquota", "Imposto", "Obs", "Imposto com sinal (crédito negativo)"], ...x.docs.map(d => [...d.map((v, i) => i >= 5 && i <= 8 ? String(v).replace(".", ",") : v), String(d[0] === "C" ? -d[8] : d[8]).replace(".", ",")])]);
  };
  el.onchange = e => { const f = e.target.dataset.f; if (f) { st[f] = e.target.value; st.pg = 0; desenha(); } };
  el.oninput = e => { if (e.target.dataset.f === "q") { st.q = e.target.value.toLowerCase(); st.pg = 0; const pos = e.target.selectionStart; desenha(); const i = el.querySelector("[data-f=q]"); i.focus(); i.setSelectionRange(pos, pos); } };
  desenha();
}

// ------------------------------------------------------------------------------------------------ evolução de um tributo
function viewTributo() {
  const t = S.tri, comps = competencias(), emps = Object.keys(D.emps).sort();
  const cores = { SP: "#7c8cff", RJ: "#38c98b", BA: "#f0b24a" };
  const met = S.metrica, f = { vp: x => x.vp, deb: x => x.deb, cred: x => x.cred, ig: x => x.ig, sc: x => x.sc }[met];
  const val = (e, c) => { const a = D.demos.filter(x => x.tri === t && x.c === c && x.e === e); return a.length ? soma(a, f) : null; };
  const serie = emps.map(e => comps.map(c => val(e, c)));
  const totC = comps.map((c, i) => soma(emps.map((e, j) => serie[j][i]).filter(v => v != null), v => v));
  const mx = Math.max(1, ...totC.filter(v => v != null).map(Math.abs));
  const W = 900, H = 230, ml = 60, mb = 26, bw = (W - ml) / comps.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for (let i = 0; i <= 4; i++) { const y = 10 + (H - mb - 14) * (1 - i / 4); svg += `<line x1="${ml}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${ml - 6}" y="${y + 4}" text-anchor="end">${fmt0(Math.round(mx * i / 4))}</text>`; }
  comps.forEach((c, i) => {
    let acc = 0; const x0 = ml + i * bw + bw * .18;
    emps.forEach((e, j) => { const v = Math.max(0, serie[j][i] || 0); if (!v) return; const h = v / mx * (H - mb - 14), y = H - mb - acc - h; acc += h; svg += `<rect x="${x0}" y="${y}" width="${bw * .64}" height="${h}" fill="${cores[e] || "#999"}" rx="2"><title>${e} · ${compLabel(c)}: ${fmt(serie[j][i])}</title></rect>`; });
    svg += `<text x="${x0 + bw * .32}" y="${H - 8}" text-anchor="middle">${compLabel(c)}</text>`;
  });
  svg += "</svg>";
  const nomeMet = METRICAS.find(m => m[0] === met)[1];
  let h = `<div class="crumb"><button data-back>‹ Painel</button> / <b style="color:var(--tx)">${t} ${esc(triNome(t))}</b></div>
  <div class="card"><div class="bar"><h2 style="margin:0">${t} ${esc(triNome(t))} — evolução mês a mês</h2><span class="sp"></span>${METRICAS.map(([k, n]) => `<button class="chip ${met === k ? "on" : ""}" data-met="${k}">${n}</button>`).join("")}</div>
  <div class="leg">${emps.map(e => `<span><i style="background:${cores[e] || "#999"}"></i>${e}</span>`).join("")}<span>métrica: ${nomeMet}</span></div>${svg}</div>
  <div class="card"><div class="scroll" style="max-height:none"><table><thead><tr><th class="l">Mês</th>${emps.map(e => `<th>${e}</th>`).join("")}<th class="tot">Total</th><th>Débitos</th><th>Créditos</th><th>Imposto das notas</th><th>Saldo credor seg.</th></tr></thead><tbody>`;
  comps.forEach((c, i) => {
    const arr = D.demos.filter(x => x.tri === t && x.c === c);
    if (!arr.length) { h += `<tr><td class="l">${compLabel(c)}</td><td colspan="${emps.length + 5}" class="faint">sem demonstrativo</td></tr>`; return; }
    h += `<tr class="rowlink" data-ir="${c}"><td class="l"><b>${compLabel(c)}</b></td>${emps.map((e, j) => `<td class="${cl(serie[j][i])}">${fmt(serie[j][i])}</td>`).join("")}<td class="tot ${cl(totC[i])}">${fmt(totC[i])}</td><td>${fmt(soma(arr, x => x.deb))}</td><td>${fmt(soma(arr, x => x.cred))}</td><td>${fmt(soma(arr, x => x.ig))}</td><td>${fmt(soma(arr, x => x.sc))}</td></tr>`;
  });
  h += `</tbody></table></div><div class="mut" style="margin-top:8px;font-size:12px">Clique numa linha para abrir o detalhe do mês (apuração, conferência e notas).</div></div><div id="detalhe"></div>`;
  $("#app").innerHTML = h;
  $("#app").onclick = e => {
    if (e.target.closest("[data-back]")) { S.view = "painel"; render(); return; }
    const b = e.target.closest("[data-met]"); if (b) { S.metrica = b.dataset.met; render(); return; }
    const r = e.target.closest("[data-ir]"); if (r) { S.sel = { tri: t, c: r.dataset.ir }; viewDetalhe(); $("#detalhe").scrollIntoView({ behavior: "smooth" }); }
  };
  if (S.sel) viewDetalhe();
}

// ------------------------------------------------------------------------------------------------ retenções × demonstrativos
function cruzaRetencoes() {
  // chave: empresa|tributo|nota. A data do relatório de retenções pode ser a do pagamento (≠ data da nota), então o casamento é por
  // nota + valor (a retenção deve ser igual ao imposto da nota no demonstrativo).
  const dem = new Map();
  for (const x of D.demos) {
    if (!Object.values(RET_TRI).includes(x.tri)) continue;
    for (const d of x.docs) {
      if (Math.abs(d[8]) < 0.005) continue;
      const k = `${x.e}|${x.tri}|${d[3]}`;
      if (!dem.has(k)) dem.set(k, []);
      dem.get(k).push({ imp: d[8], x, d, usado: false });
    }
  }
  const emps = new Set(D.retInfo.map(r => r.e));
  const linhas = [];
  for (const r of D.rets) {
    const tri = RET_TRI[r.ic]; const cand = (dem.get(`${r.e}|${tri}|${r.nota}`) || []).filter(o => !o.usado);
    let o = cand.find(c => Math.abs(c.imp - r.ret) < 0.02);
    if (o) { o.usado = true; linhas.push({ ...r, st: "ok", dem: o.imp, dataDem: o.d[4] }); continue; }
    o = cand.sort((a, b) => Math.abs(a.imp - r.ret) - Math.abs(b.imp - r.ret))[0];
    if (o) { o.usado = true; linhas.push({ ...r, st: "valor diferente", dem: o.imp, dataDem: o.d[4] }); }
    else linhas.push({ ...r, st: "só relatório", dem: null });
  }
  if (D.rets.length) for (const [k, arr] of dem) for (const o of arr) {
    if (o.usado || !emps.has(o.x.e)) continue;
    linhas.push({ e: o.x.e, ic: Object.keys(RET_TRI).find(i => RET_TRI[i] === o.x.tri), im: triNome(o.x.tri), nota: o.d[3], data: o.d[4], valor: o.d[5], ret: null, cr: "", nat: "", fc: "", fn: o.x.fn || "", st: "só demonstrativo", dem: o.imp });
  }
  return linhas;
}

  $("#app").innerHTML = h;
  $("#app").onclick = e => {
    const b = e.target.closest("[data-rf]"); if (b) { S.retFiltro = b.dataset.rf; viewRet(); return; }
    if (e.target.id === "csvRet") baixarCsv("retencoes-x-demonstrativos.csv", [["Status", "Empresa", "Imposto", "Fornecedor", "Nota", "Data", "Valor", "Retenção", "Imposto demonstrativo", "Cód. rec."], ...lista.map(l => [l.st, l.e, l.ic + " " + l.im, (l.fc || "") + " " + (l.fn || ""), l.nota, l.data, String(l.valor ?? "").replace(".", ","), String(l.ret ?? "").replace(".", ","), String(l.dem ?? "").replace(".", ","), l.cr])]);
  };
}
const compDe = d => d.slice(6) + "-" + d.slice(3, 5);

// ------------------------------------------------------------------------------------------------ filiais
function viewFiliais() {
  const emps = Object.keys(D.emps).sort();
  const base = D.demos.filter(x => S.per === "ANO" || x.c === S.per);
  const tris = [...new Set(base.map(x => x.tri))].sort();
  const met = S.metrica;
  const f = { vp: x => x.vp, deb: x => x.deb, cred: x => x.cred, ig: x => x.ig, sc: x => x.sc }[met];
  let h = `<div class="card"><div class="bar"><b>Comparativo entre filiais — ${S.per === "ANO" ? "ano todo" : compLabel(S.per)}</b><span class="sp"></span>${METRICAS.map(([k, n]) => `<button class="chip ${met === k ? "on" : ""}" data-met="${k}">${n}</button>`).join("")}<button class="chip" id="csvFil">⬇ CSV</button></div>
  <div class="scroll" style="max-height:none"><table><thead><tr><th class="l">Tributo</th>${emps.map(e => `<th>${e}</th>`).join("")}<th class="tot">Total</th><th class="l">Participação</th></tr></thead><tbody>`;
  const csv = [["Tributo", ...emps, "Total"]];
  const cores = { SP: "#7c8cff", RJ: "#38c98b", BA: "#f0b24a" };
  for (const t of tris) {
    const vals = emps.map(e => {
      const arr = base.filter(x => x.tri === t && x.e === e);
      if (met === "sc") { const u = arr.filter(x => f(x) != null).sort((a, b) => a.c.localeCompare(b.c)); const ult = u.length ? u[u.length - 1].c : null; return ult ? soma(u.filter(x => x.c === ult), f) : null; }
      return arr.length ? soma(arr, f) : null;
    });
    const tot = soma(vals.filter(v => v != null), v => v);
    const pos = vals.map(v => Math.max(0, v || 0)), sm = pos.reduce((a, b) => a + b, 0);
    h += `<tr><td class="l"><b>${t}</b> ${esc(triNome(t))}</td>${vals.map(v => `<td class="${cl(v)}">${fmt(v)}</td>`).join("")}<td class="tot">${fmt(tot)}</td><td class="l"><div class="bars">${sm > 0 ? emps.map((e, i) => `<i title="${e} ${Math.round(100 * pos[i] / sm)}%" style="width:${100 * pos[i] / sm}%;background:${cores[e] || "#999"}"></i>`).join("") : ""}</div></td></tr>`;
    csv.push([`${t} ${triNome(t)}`, ...vals.map(v => v == null ? "" : String(v).replace(".", ",")), tot == null ? "" : String(tot).replace(".", ",")]);
  }
  h += `</tbody></table></div><div class="mut" style="margin-top:8px;font-size:12px">${emps.map(e => `<span style="color:${cores[e] || "#999"}">■</span> ${e}`).join(" &nbsp; ")}</div></div>`;
  $("#app").innerHTML = h;
  $("#app").onclick = e => { const b = e.target.closest("[data-met]"); if (b) { S.metrica = b.dataset.met; render(); } if (e.target.id === "csvFil") baixarCsv("comparativo-filiais.csv", csv); };
}

// ------------------------------------------------------------------------------------------------ alertas
function geraAlertas() {
  const A = [];
  const escopo = D.demos.filter(x => S.emp === "ALL" || x.e === S.emp);
  // 1) notas x total
  for (const x of escopo) for (const k of x.conf) if (!k.ok) A.push({ sev: "bad", t: `Notas não fecham com o total — ${x.tri} ${triNome(x.tri)} ${compLabel(x.c)} (${x.e})`, d: `${esc(x.arq)} · soma ${fmt(k.soma)} × total ${fmt(k.total)}`, sel: { tri: x.tri, c: x.c } });
  // 2) cobertura (meses mensais faltando)
  const comps = competencias();
  const porTri = {};
  for (const x of escopo) { (porTri[x.e + "|" + x.tri] ||= new Set()).add(x.c); }
  for (const [k, set] of Object.entries(porTri)) {
    const [e, tri] = k.split("|"); if (tri === "006" || tri === "007") continue;
    const falt = comps.filter(c => !set.has(c));
    if (falt.length && set.size >= 2) A.push({ sev: "info", t: `Meses sem demonstrativo — ${e} · ${tri} ${triNome(tri)}`, d: "Sem arquivo em: " + falt.map(compLabel).join(", ") + " (o Domínio não gera o relatório de meses sem movimento; confira se faltou subir algum)" });
  }
  // 3) continuidade do saldo credor (saldo seguinte do mês = saldo anterior do mês seguinte)
  for (const e of Object.keys(D.emps)) {
    if (S.emp !== "ALL" && S.emp !== e) continue;
    for (const tri of [...new Set(D.demos.filter(x => x.e === e).map(x => x.tri))]) {
      const arr = D.demos.filter(x => x.e === e && x.tri === tri && x.sc != null && x.sca != null).sort((a, b) => a.c.localeCompare(b.c));
      for (let i = 1; i < arr.length; i++) {
        const mesAnt = new Date(+arr[i].c.slice(0, 4), +arr[i].c.slice(5) - 2, 1); const esperado = mesAnt.getFullYear() + "-" + String(mesAnt.getMonth() + 1).padStart(2, "0");
        if (arr[i - 1].c === esperado && Math.abs(arr[i - 1].sc - arr[i].sca) > 0.02)
          A.push({ sev: "bad", t: `Saldo credor não "vira" — ${e} · ${tri} ${triNome(tri)} ${compLabel(arr[i - 1].c)} → ${compLabel(arr[i].c)}`, d: `saldo credor p/ mês seguinte ${fmt(arr[i - 1].sc)} × saldo credor do período anterior ${fmt(arr[i].sca)}`, sel: { tri, c: arr[i].c } });
      }
    }
  }
  // 4) imposto das notas x débitos da apuração
  const dif = escopo.filter(x => x.debN != null && x.debA != null && Math.abs(x.debN - x.debA) > 0.02).sort((a, b) => Math.abs(b.debN - b.debA) - Math.abs(a.debN - a.debA));
  for (const x of dif.slice(0, 25)) A.push({ sev: "info", t: `Imposto das notas ≠ débitos da apuração — ${x.tri} ${triNome(x.tri)} ${compLabel(x.c)} (${x.e})`, d: `notas ${fmt(x.debN)} × apuração ${fmt(x.debA)} · diferença ${fmt(x.debN - x.debA)} (pode ser dispensa, compensação ou retenção tratada pela data de pagamento)`, sel: { tri: x.tri, c: x.c } });
  if (dif.length > 25) A.push({ sev: "info", t: `…e mais ${dif.length - 25} diferenças entre notas e apuração`, d: "Veja nos demonstrativos (Painel → célula)." });
  // 5) retenções
  if (D.rets.length) {
    const r = cruzaRetencoes().filter(l => (S.emp === "ALL" || l.e === S.emp) && l.st !== "ok");
    const c = {}; r.forEach(l => c[l.st] = (c[l.st] || 0) + 1);
    for (const [k, n] of Object.entries(c)) A.push({ sev: k === "valor diferente" ? "bad" : "warn", t: `Retenções × demonstrativos: ${n} nota(s) "${k}"`, d: "Veja a aba Retenções.", ir: k });
  }
  const ordem = { bad: 0, warn: 1, info: 2 };
  return A.sort((a, b) => ordem[a.sev] - ordem[b.sev]);
}
function viewAlertas() {
  const A = geraAlertas();
  const n = s => A.filter(a => a.sev === s).length;
  $("#app").innerHTML = `<div class="kpis"><div class="kpi"><div class="l">Críticos</div><div class="v neg">${n("bad")}</div></div><div class="kpi"><div class="l">Atenção</div><div class="v" style="color:var(--warn)">${n("warn")}</div></div><div class="kpi"><div class="l">Informativos</div><div class="v" style="color:var(--info)">${n("info")}</div></div></div>
  <div class="card">${A.length ? A.map((a, i) => `<div class="alert"><span class="tag ${a.sev}">${{ bad: "crítico", warn: "atenção", info: "info" }[a.sev]}</span><div><b>${a.t}</b><div class="mut">${a.d}</div>${a.sel ? `<button class="lnk" data-al="${i}">ver detalhe</button>` : ""}${a.ir ? `<button class="lnk" data-ir="${esc(a.ir)}">ver retenções</button>` : ""}</div></div>`).join("") : "<div class='pos'>Nenhum alerta para o escopo selecionado.</div>"}</div>`;
  $("#app").onclick = e => {
    const b = e.target.closest("[data-al]"); if (b) { S.view = "painel"; S.sel = A[+b.dataset.al].sel; S.per = "ANO"; render(); setTimeout(() => $("#detalhe")?.scrollIntoView({ behavior: "smooth" }), 50); return; }
    const r = e.target.closest("[data-ir]"); if (r) { S.view = "ret"; S.retFiltro = r.dataset.ir; render(); }
  };
}

// ------------------------------------------------------------------------------------------------ util
function baixarCsv(nome, linhas) {
  const csv = "﻿" + linhas.map(l => l.map(v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = nome; a.click();
}
function render() {
  montaCabecalho();
  ({ painel: viewPainel, tributo: viewTributo, notas: viewNotas, ret: viewRet, filiais: viewFiliais, alertas: viewAlertas }[S.view])();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel) { S.sel = null; const d = $("#detalhe"); if (d) d.innerHTML = ""; } });
(async () => {
  try { document.documentElement.dataset.tema = localStorage.tema || ""; } catch (e) { }
  try { D = await carregar(); } catch (e) { $("#msg").textContent = "Não consegui abrir os dados (use o Chrome ou o Edge): " + e.message; return; }
  carregaMarc();
  render();
})();
</script>
