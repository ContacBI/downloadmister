    var aviso = sem.length ? '<div class="cf-rodape" style="border:1px solid var(--warn);border-radius:10px;background:var(--warn-soft);color:var(--ink)"><span><b>Conta Banco sem banco vinculado:</b> ' + sem.map(function (k) { return esc(k) + " (" + SUG.semCodigo[k] + " linha(s))"; }).join(", ") + '. Defina o código no cadastro do banco (Bancos → ✎ → "Código nos relatórios"); enquanto isso essas linhas ficam fora dos matches.</span></div>' : "";
    var opt = '<option value="">Todos os bancos</option>' + CONTAS.filter(function (c) { return DOCS[c.id]; }).map(function (c) { return '<option value="' + esc(c.id) + '"' + (SG.conta === c.id ? " selected" : "") + ">" + esc(c.apelido + (c.numeroConta ? " · " + c.numeroConta : "")) + "</option>"; }).join("");
    var tipos = [["todos", "Todos"], ["casados", "Casados"], ["1:1", "1×1"], ["N:1", "N×1"], ["1:N", "1×N"], ["N:N", "N×N"], ["sem", "Sem match"]];
    $("abaCorpo").innerHTML = '<div class="resumo-cards">' + cards.join("") + "</div>" + aviso +
      '<div class="lr-bar"><input id="sgBusca" placeholder="Buscar histórico, cliente/fornecedor, nº…" value="' + esc(SG.texto) + '"><select id="sgConta" class="fil">' + opt + "</select>" +
      '<select id="sgLado" class="fil"><option value="todos">Entradas e saídas</option><option value="receber"' + (SG.lado === "receber" ? " selected" : "") + '>Só entradas (recebimentos)</option><option value="pagar"' + (SG.lado === "pagar" ? " selected" : "") + ">Só saídas (pagamentos)</option></select>" +
      tipos.map(function (t) { return '<button class="fil' + (SG.tipo === t[0] ? " on" : "") + '" data-sg-tipo="' + t[0] + '">' + t[1] + "</button>"; }).join("") + '<span class="sp"></span><span class="resumo" id="sgResumo"></span></div><div id="sgTabela"></div>';
    $("sgBusca").addEventListener("input", function () { var p = this.selectionStart; SG.texto = this.value; pintarSugestoes(); var n = $("sgBusca"); if (n) { n.focus(); n.setSelectionRange(p, p); } });
    $("sgConta").onchange = function () { SG.conta = this.value; pintarSugestoes(); };
    $("sgLado").onchange = function () { SG.lado = this.value; pintarSugestoes(); };
    document.querySelectorAll("[data-sg-tipo]").forEach(function (b) { b.onclick = function () { SG.tipo = b.getAttribute("data-sg-tipo"); document.querySelectorAll("[data-sg-tipo]").forEach(function (x) { x.classList.toggle("on", x === b); }); pintarSugestoes(); }; });
    pintarSugestoes();
  }
  function pintarSugestoes() {
    var gs = gruposFiltrados(); $("sgResumo").textContent = fmtNum.format(gs.length) + " grupo(s)";
    var cor = { "1:1": "var(--ok)", sem: "var(--warn)" };
    var corpo = gs.map(function (g) {
      var se = somaExt(g), sr = somaRel(g), dif = round2(se - sr), tipo = '<span class="ex-chip" style="color:' + (cor[g.tipo] || "var(--accent)") + '">' + ROT_TIPO[g.tipo] + "</span>";
      var ext = g.ext.length ? listaCurta(g.ext, function (e) { return esc(dataBr(e.data)) + " · " + esc(e.descricao); }) : '<span style="color:var(--faint)">—</span>';
      var rel = g.rel.length ? listaCurta(g.rel, function (l) { return esc(dataBr(l.dt)) + " · " + esc(l.nome || "") + (l.doc ? " · nº " + esc(l.doc) : ""); }) : '<span style="color:var(--faint)">—</span>';
      return "<tr><td>" + esc(dataBr(g.dt)) + "</td><td>" + logoMini(g.conta.banco) + " " + esc(g.conta.apelido) + "</td><td>" + (g.lado === "receber" ? "Entrada" : "Saída") + "</td><td>" + tipo + (g.dias ? ' <small style="color:var(--faint)">' + (g.dias > 0 ? "+" : "") + g.dias + "d</small>" : "") + "</td><td>" + ext + '</td><td class="num">' + (g.ext.length ? brl(se) : "—") + "</td><td>" + rel + '</td><td class="num">' + (g.rel.length ? brl(sr) : "—") + '</td><td class="num">' + (g.ext.length && g.rel.length ? (dif === 0 ? "—" : brl(dif)) : "") + "</td></tr>";
    }).join("") || '<tr><td colspan="9"><div class="fn-vazio">Nada nesse filtro.</div></td></tr>';
    $("sgTabela").innerHTML = '<div class="tab-wrap"><table class="fn-tab"><thead><tr><th>Data</th><th>Banco</th><th>Lado</th><th>Match</th><th>Extrato</th><th class="num">Valor extrato</th><th>Relatório</th><th class="num">Valor relatório</th><th class="num">Diferença</th></tr></thead><tbody>' + corpo + "</tbody></table></div>";
  }

  /* ---- Excel da aba aberta ---- */
  function baixarExcelAba() {
    if (typeof ExcelBonito === "undefined") { showToast("Gerador de Excel não carregou."); return; }
    var titulo = "Conciliação " + rotuloMes(MES), abas = [];
    if (TAB === "extratos" || TAB === "matches") {
      var mat = TAB === "matches", rows = filtrarLista(mat);
      if (!rows.length) { showToast("Nada pra exportar."); return; }
      var cols = [{ titulo: "Data", chave: "data", tipo: "data" }, { titulo: "Banco", chave: "banco", largura: 28 }, { titulo: "D", chave: "d", largura: 14 }, { titulo: "C", chave: "c", largura: 14 }, { titulo: "Histórico", chave: "hist", largura: 60 }];
      if (mat) cols.push({ titulo: "Histórico ajustado", chave: "aj", largura: 60 });
      cols.push({ titulo: "Valor", chave: "valor", tipo: "moeda", total: true }, { titulo: "Vínculo", chave: "vinc", largura: 20 });
      abas.push({ nome: mat ? "Matches" : "Extratos", colunas: cols,
        linhas: rows.map(function (x) {
          var dc = valoresDC(x);
          return { data: x.l.data, banco: x.c.apelido, d: dc.d, c: dc.c, hist: x.l.descricao, aj: ajEfetivo(x.l), valor: x.l.valor, vinc: vinculoTexto(x) };
        }) });
    } else {
      var aba = abaAtual(TAB); if (!aba) { showToast("Nada pra exportar."); return; }
      var linhas = linhasRelatorio(TAB, aba), cfg = configColunas(TAB, aba), vis = cfg.ordem.filter(function (c) { return cfg.visiveis.indexOf(c) !== -1; });
      abas.push({ nome: aba.nomeAba, colunas: vis.map(function (c, i) { return { titulo: c, chave: "c" + i, tipo: ehNumerica(c, aba.linhas) ? (RE_COL_VALOR.test(c) ? "moeda" : "numero") : "texto", total: ehNumerica(c, aba.linhas) }; }),
        linhas: linhas.map(function (l) { var o = {}; vis.forEach(function (c, i) { var v = l[c]; if (typeof v === "number" && RE_COL_DATA.test(c) && pareceDataSerial(v)) v = excelSerialParaData(v); o["c" + i] = v; }); return o; }) });
      titulo += " — " + (TAB === "pagar" ? "Pagamentos" : "Recebimentos");
    }
    ExcelBonito.baixar({ arquivo: titulo + " - " + empresaNome, empresa: empresaNome, titulo: titulo, abas: abas }).then(function () { showToast("Excel baixado."); }).catch(function (e) { showToast(e.message); });
  }

  /* ---------------- boot ---------------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-tema]");
    if (t) { $("btnTema").click(); document.querySelectorAll("[data-tema]").forEach(function (b) { b.textContent = $("btnTema").textContent; }); return; }
    var a = e.target.closest && e.target.closest("[data-voltar]"); if (a) { e.preventDefault(); $("voltarHub").click(); }
  });
  $("navMes").addEventListener("click", function () { if (MES) renderEscolherMes(); else renderEscolherMes(); });
  restaurarVisao();
  if (!empresaId) {
    $("panelMain").innerHTML = '<div class="fn-vazio">Nenhuma empresa vinculada. Abra essa ferramenta a partir do hub (Grupo Micromedical).</div>';
    setStatus("", "Sem empresa.");
    return;
  }
  carregarTransferencias().then(function () { if (MES && Object.keys(DOCS).length) { MATCH_OK = false; renderMes(); } });
  carregarAplicacoes().catch(function () { /* sem aplicações: segue normal */ });
  AplicacoesLanc.ouvir(empresaId, function () { carregarAplicacoes().catch(function () { /* mantém o que já tinha */ }); }); // salvou algo em Conferência de Aplicações -> atualiza na hora
  carregarBase().then(function () { setStatus("ok", "Pronto."); if (MES) abrirMes(MES); else renderEscolherMes(); if (window.HubAlertas) HubAlertas.iniciar({ onContasAlteradas: function () { carregarBase().then(function () { if (MES) abrirMes(MES); }); } }); })
    .catch(function (err) { setStatus("warn", "Erro ao carregar."); $("panelMain").innerHTML = '<div class="fn-vazio">Erro: ' + esc(err.message) + "</div>"; });
}

if (document.body) appMain();
else document.addEventListener("DOMContentLoaded", appMain);
</script>
